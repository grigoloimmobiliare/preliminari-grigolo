<!doctype html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titolo %}Preliminari{% endblock %} · Grigolo Immobiliare</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="barra">
    <a class="marchio" href="/">Grigolo Immobiliare <span>Preliminari</span></a>

  <script src="/static/app.js"></script>
</body>
</html>
