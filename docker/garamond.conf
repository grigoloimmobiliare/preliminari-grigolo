<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Il modello usa "Garamond" (font Microsoft, non installabile su Linux):
     per il conteggio delle pagine si usa EB Garamond, di dimensioni molto simili. -->
<fontconfig>
  <alias binding="same">
    <family>Garamond</family>
    <prefer><family>EB Garamond</family></prefer>
  </alias>
</fontconfig>
