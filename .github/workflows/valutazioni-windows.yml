# Costruisce il pacchetto Windows del programma delle valutazioni, da copiare nella cartella
# condivisa del server. Prima lo prova su Windows: test, avvio, creazione di un Word, browser.
# Il pacchetto si scarica, senza bisogno di accedere a GitHub, da un link che non cambia:
#   https://github.com/grigoloimmobiliare/preliminari-grigolo/releases/download/valutazioni/Valutazioni.zip
# (release "valutazioni", aggiornata a ogni costruzione riuscita). Resta anche negli "Artifacts" dell'esecuzione.
name: Valutazioni - pacchetto Windows

on:
  push:
    paths:
      - "valutazioni/**"
      - ".github/workflows/valutazioni-windows.yml"
  workflow_dispatch:

permissions:
  contents: write          # per aggiornare la release con il pacchetto

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: valutazioni
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pyinstaller
          python -m playwright install chromium

      - name: Tesseract con l'italiano
        run: |
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata/raw/main/ita.traineddata -OutFile "$t\tessdata\ita.traineddata"
          & "$t\tesseract.exe" --list-langs
          "$t" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Test
        run: python -m pytest -q

      - name: Costruzione del programma
        run: |
          pyinstaller --noconfirm --clean --name Valutazioni --console `
            --paths . `
            --collect-all playwright --collect-all pymupdf --collect-data docx `
            --collect-submodules uvicorn --hidden-import python_multipart --hidden-import app.main `
            --add-data "app/web;app/web" --add-data "app/risorse;app/risorse" --add-data "modelli;modelli" `
            windows/avvia.py
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" dist/Valutazioni/tesseract
          "$env:GITHUB_SHA $(Get-Date -Format 'yyyy-MM-dd HH:mm')" | Out-File dist/Valutazioni/versione.txt

      - name: Pacchetto per la cartella condivisa
        run: |
          $p = "pacchetto/Valutazioni"
          New-Item -ItemType Directory -Force "$p/Dati" | Out-Null
          Copy-Item -Recurse dist/Valutazioni "$p/Programma"
          Copy-Item "windows/Avvia Valutazioni.bat" $p
          Copy-Item windows/LEGGIMI.txt $p

      - name: Prova del pacchetto (avvio, Word, browser)
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\locale"
          $dati = "$env:RUNNER_TEMP\Dati prova"
          $exe = "pacchetto/Valutazioni/Programma/Valutazioni.exe"
          & $exe --prova-browser
          if ($LASTEXITCODE -ne 0) { throw "browser non avviato" }
          & $exe --prova-ocr
          if ($LASTEXITCODE -ne 0) { throw "lettura delle superfici scritte non riuscita" }
          & $exe --prova-omi-processo
          if ($LASTEXITCODE -ne 0) { throw "ricerca OMI in processo separato non riuscita" }
          $proc = Start-Process -FilePath $exe -ArgumentList "`"$dati`"" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8081/salute | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "il programma non risponde" }
          python windows/prova_pacchetto.py http://127.0.0.1:8081 "$dati"
          $code = $LASTEXITCODE
          Stop-Process -Id $proc.Id -Force
          if ($code -ne 0) { throw "prova non riuscita" }

      - uses: actions/upload-artifact@v4
        with:
          name: Valutazioni-cartella-condivisa
          path: valutazioni/pacchetto

      - name: Pubblicazione al link fisso (release "valutazioni")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pacchetto/* -DestinationPath Valutazioni.zip -Force
          $note = "Pacchetto per la cartella condivisa del programma delle valutazioni. Versione $env:GITHUB_SHA del $(Get-Date -Format 'dd/MM/yyyy HH:mm'). Estrai lo zip e sostituisci la cartella Programma (la cartella Dati non va toccata)."
          gh release view valutazioni --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create valutazioni --repo $env:GITHUB_REPOSITORY --title "Programma valutazioni (ultima versione)" --notes $note --target $env:GITHUB_SHA
          } else {
            gh release edit valutazioni --repo $env:GITHUB_REPOSITORY --notes $note
          }
          gh release upload valutazioni Valutazioni.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "pubblicazione non riuscita" }
