# Elenco delle zone OMI di un comune (e, a richiesta, i valori di ogni zona) dal sito
# dell'Agenzia delle Entrate. Serve anche a controllare che la ricerca automatica funzioni.
# Avvio a mano: Actions -> "Zone OMI" -> Run workflow.
name: Zone OMI

on:
  workflow_dispatch:
    inputs:
      provincia:
        description: Sigla della provincia
        default: TV
      comune:
        description: Comune
        default: Treviso
      valori:
        description: Scaricare anche i valori di ogni zona (si/no)
        default: "si"
  push:
    paths:
      - "valutazioni/strumenti/zone_omi.py"
      - ".github/workflows/zone-omi.yml"

jobs:
  zone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valutazioni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Zone OMI
        env:
          PROVINCIA: ${{ inputs.provincia || 'TV' }}
          COMUNE: ${{ inputs.comune || 'Treviso' }}
          VALORI: ${{ inputs.valori || 'si' }}
        run: |
          extra=""
          [ "$VALORI" = "si" ] && extra="--valori"
          python strumenti/zone_omi.py "$PROVINCIA" "$COMUNE" $extra --uscita zone_omi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zone-omi
          path: valutazioni/zone_omi
