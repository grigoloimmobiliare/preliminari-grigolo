# Costruisce il pacchetto Windows del programma "Sintesi atti di provenienza", da copiare nella
# cartella condivisa del server. Prima lo prova su Windows: test, OCR, avvio, sintesi dalla pagina
# e dalla cartella condivisa.
# Il pacchetto si scarica, senza bisogno di accedere a GitHub, da un link che non cambia:
#   https://github.com/grigoloimmobiliare/preliminari-grigolo/releases/download/sintesi/Sintesi.zip
# (release "sintesi", aggiornata a ogni costruzione riuscita). Resta anche negli "Artifacts" dell'esecuzione.
name: Sintesi atti - pacchetto Windows

on:
  push:
    paths:
      - "sintesi/**"
      - "app/testo.py"
      - "app/estrazione/**"
      - "tests/test_sintesi.py"
      - ".github/workflows/sintesi-windows.yml"
  workflow_dispatch:

permissions:
  contents: write          # per aggiornare la release con il pacchetto

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r sintesi/requirements.txt pytest httpx pyinstaller

      - name: Tesseract con l'italiano
        run: |
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata/raw/main/ita.traineddata -OutFile "$t\tessdata\ita.traineddata"
          & "$t\tesseract.exe" --list-langs

      - name: Test
        run: python -m pytest -q tests/test_sintesi.py

      - name: Costruzione del programma
        run: |
          pyinstaller --noconfirm --clean --name Sintesi --console `
            --paths . `
            --collect-all pymupdf --collect-data reportlab `
            --collect-submodules uvicorn --hidden-import python_multipart --hidden-import sintesi.main `
            --add-data "sintesi/web;sintesi/web" `
            sintesi/windows/avvia.py
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" dist/Sintesi/tesseract
          "$env:GITHUB_SHA $(Get-Date -Format 'yyyy-MM-dd HH:mm')" | Out-File dist/Sintesi/versione.txt

      - name: Pacchetto per la cartella condivisa
        run: |
          $p = "pacchetto/Sintesi"
          New-Item -ItemType Directory -Force "$p/Dati" | Out-Null
          Copy-Item -Recurse dist/Sintesi "$p/Programma"
          Copy-Item "sintesi/windows/Avvia Sintesi.bat" $p
          Copy-Item sintesi/windows/LEGGIMI.txt $p

      - name: Prova del pacchetto (OCR, pagina, cartella condivisa)
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\locale"
          $dati = "$env:RUNNER_TEMP\Dati prova"
          $exe = "pacchetto/Sintesi/Programma/Sintesi.exe"
          & $exe --prova-ocr
          if ($LASTEXITCODE -ne 0) { throw "Tesseract incluso non funziona" }
          $proc = Start-Process -FilePath $exe -ArgumentList "`"$dati`"", "--senza-browser" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8091/salute | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "il programma non risponde" }
          python sintesi/windows/prova_pacchetto.py http://127.0.0.1:8091 "$dati"
          $code = $LASTEXITCODE
          Stop-Process -Id $proc.Id -Force
          if ($code -ne 0) { throw "prova non riuscita" }

      - uses: actions/upload-artifact@v4
        with:
          name: Sintesi-cartella-condivisa
          path: pacchetto

      - name: Pubblicazione al link fisso (release "sintesi")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pacchetto/* -DestinationPath Sintesi.zip -Force
          $note = "Pacchetto per la cartella condivisa del programma Sintesi atti di provenienza. Versione $env:GITHUB_SHA del $(Get-Date -Format 'dd/MM/yyyy HH:mm'). Estrai lo zip e sostituisci la cartella Programma (la cartella Dati non va toccata)."
          gh release view sintesi --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create sintesi --repo $env:GITHUB_REPOSITORY --title "Programma sintesi atti di provenienza (ultima versione)" --notes $note --target $env:GITHUB_SHA
          } else {
            gh release edit sintesi --repo $env:GITHUB_REPOSITORY --notes $note
          }
          # il caricamento di file grandi a volte fallisce per un errore momentaneo di GitHub: si riprova
          $caricato = $false
          foreach ($tentativo in 1..4) {
            gh release upload sintesi Sintesi.zip --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -eq 0) { $caricato = $true; break }
            Write-Host "Caricamento non riuscito (tentativo $tentativo di 4), riprovo tra $(30 * $tentativo) secondi..."
            Start-Sleep -Seconds (30 * $tentativo)
          }
          if (-not $caricato) { throw "pubblicazione non riuscita" }
